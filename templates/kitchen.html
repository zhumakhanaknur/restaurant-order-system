{% extends "base.html" %}
{% block title %}Асхана экраны{% endblock %}
{% block content %}
<h1>👨‍🍳 Асхана экраны</h1>
<div id="orders" class="orders"></div>
<script>
async function loadOrders() {
    const response = await fetch("/api/kitchen/orders");
    const orders = await response.json();
    const container = document.getElementById("orders");
    container.innerHTML = "";

    orders.forEach(order => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <h2>Тапсырыс #${order.id}</h2>
            <p>${order.items || ""}</p>
            <p>Сома: ${Number(order.total).toLocaleString("kk-KZ")} ₸</p>
            <select onchange="setStatus(${order.id}, this.value)">
                ${["new","preparing","ready","completed"].map(s =>
                    `<option value="${s}" ${s === order.status ? "selected" : ""}>${s}</option>`
                ).join("")}
            </select>
        `;
        container.appendChild(card);
    });
}
async function setStatus(id, status) {
    await fetch("/api/orders/" + id + "/status", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({status})
    });
    loadOrders();
}
loadOrders();
setInterval(loadOrders, 5000);
</script>
{% endblock %}
